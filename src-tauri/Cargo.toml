[package]
name = "pulse"
version = "1.1.0"
description = "Pulse — Local Windows Voice-to-Text"
authors = ["you"]
edition = "2024"

[lib]
name = "pulse_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
arboard = "3"
enigo = "0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "hickory-dns", "json"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
cpal = "0.15"
whisper-rs = "0.16.0"
flate2 = "1.0"
tar = "0.4"
parakeet-rs = "0.4.4"
canary-rs = { path = "crates/canary-rs" }
regex = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
